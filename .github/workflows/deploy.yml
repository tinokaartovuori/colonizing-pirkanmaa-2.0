name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public HTTPS URL of the Cloudflare Worker game-records backend.
          # Set once as a repo variable: Settings → Secrets and variables →
          # Actions → Variables → New variable → VITE_CP_SERVER =
          # https://cp-games.<your-subdomain>.workers.dev
          # If unset, the client falls back to localhost and uploads no-op in prod.
          VITE_CP_SERVER: ${{ vars.VITE_CP_SERVER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
