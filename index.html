<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colonizing Pirkanmaa</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* PressStart2P is also registered with Phaser, but declaring it here
         lets the browser pre-load the face so first text render is crisp. */
      @font-face {
        font-family: 'PressStart2P';
        src: url('./assets/fonts/PressStart2P.ttf') format('truetype');
        font-display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
