[package]
name = "cp-train"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "value_train"
path = "src/bin/value_train.rs"

[[bin]]
name = "cnn_fwd_parity"
path = "src/bin/cnn_fwd_parity.rs"

[dependencies]
cp-sim = { path = "../cp-sim" }
cp-ai = { path = "../cp-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
